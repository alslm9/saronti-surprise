<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة سارونتي | قصة حب وذكريات</title>
    <style>
        :root {
            --burgundy: #2D080E;
            --burgundy-deep: #1A0408;
            --burgundy-light: #4A0E17;
            --ivory: #FFFDF9;
            --soft-pink: #F4C2C2;
            --warm-beige: #F5EBE6;
            --soft-gray: #7A6E6D;
            --gold: #D4AF37;
            --gold-light: #E6B800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--burgundy-deep);
            color: var(--ivory);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية نباتية فاخرة وبتلات */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(244, 194, 194, 0.05) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* حاوية بتلات الورد المتحركة */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: rgba(244, 194, 194, 0.25);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* الإطار العام للتجربة */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(135deg, rgba(45, 8, 14, 0.95), rgba(26, 4, 8, 0.98));
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 20px;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 24px;
                height: 85vh;
            }
        }

        /* شريط علوي أدوات التحكم */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--gold);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding-bottom: 10px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--soft-pink);
            font-size: 13px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .btn-text:hover {
            opacity: 1;
        }

        /* محتوى المشاهد */
        .scene-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px 10px;
            animation: fadeIn 0.6s ease-in-out;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            font-family: serif;
            color: var(--gold);
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        h2 { font-size: 22px; }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--ivory);
            margin-bottom: 20px;
            max-width: 360px;
        }

        /* رسومات الزهور الفنية داخل المشاهد */
        .floral-accent {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--gold);
        }

        /* الأزرار التفاعلية الفاخرة */
        .btn-primary {
            background: linear-gradient(135deg, var(--burgundy-light), #6B1622);
            color: var(--ivory);
            border: 1px solid var(--gold);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
            font-weight: 500;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* أزرار الاختيارات والأسئلة */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 15px;
        }

        .btn-option {
            background: rgba(255, 253, 249, 0.05);
            border: 1px solid rgba(244, 194, 194, 0.3);
            color: var(--ivory);
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-option:hover, .btn-option.selected {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
        }

        /* صناديق المفاجآت */
        .boxes-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .gift-box {
            background: rgba(255, 253, 249, 0.07);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px 15px;
            cursor: pointer;
            transition: transform 0.3s;
            flex: 1;
            max-width: 100px;
            text-align: center;
        }

        .gift-box:hover {
            transform: translateY(-5px);
            background: rgba(212, 175, 55, 0.1);
        }

        /* صناديق الحديقة التفاعلية */
        .garden-cards {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .garden-card {
            background: rgba(255,253,249,0.04);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            padding: 12px 8px;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }

        .garden-card:hover {
            border-color: var(--gold);
            background: rgba(212,175,55,0.1);
        }

        /* مساحة كتابة الرسالة (المشهد 23) */
        textarea {
            width: 100%;
            max-width: 340px;
            height: 120px;
            background: rgba(255, 253, 249, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 12px;
            color: var(--ivory);
            font-size: 15px;
            resize: none;
            margin-bottom: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--gold);
        }

        /* شريط التنقل السفلي بين المشاهد */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding-top: 12px;
            font-size: 14px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--soft-pink);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .nav-btn:hover { opacity: 1; }
        .scene-counter { color: var(--soft-gray); font-size: 12px; }

        /* رسالة النجاح لإرسال رسالتها */
        .success-msg {
            color: var(--gold);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

                content: `
                    <div class="floral-accent">🎉</div>
                    <h2>كل عام وأنتِ بخير</h2>
                    <p>كل عام وأنتِ أعيادي، يا أجمل من عرفت، ويا سوسو الغالية على قلبي.. عسى عيد ميلادك ينعاد عليك وأنتِ بألف خير وسعادة.</p>
                `
            },
            {
                title: "الخاتمة",
                content: `
                    <div class="floral-accent">🤍</div>
                    <h2>من سلوم.. بكل الحب</h2>
                    <p>انتهت رحلتنا هنا، لكن حكايتنا الحقيقية توها تبدأ.<br><br><b>أحبك يا سارونتي.</b></p>
                    <button class="btn-primary" onclick="resetJourney()">إعادة الرحلة من البداية ↺</button>
                `
            }
        ];

        let currentScene = parseInt(localStorage.getItem('saronti_scene')) || 0;

        function renderScene() {
            const container = document.getElementById('sceneContainer');
            const counter = document.getElementById('sceneCounter');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            container.innerHTML = scenes[currentScene].content;
            counter.innerText = `${currentScene + 1} / ${scenes.length}`;

            prevBtn.style.visibility = currentScene === 0 ? 'hidden' : 'visible';
            nextBtn.style.visibility = currentScene === scenes.length - 1 ? 'hidden' : 'visible';

            // حفظ التقدم تلقائياً
            localStorage.setItem('saronti_scene', currentScene);
        }

        function nextScene() {
            if (currentScene < scenes.length - 1) {
                currentScene++;
                renderScene();
            }
        }

        function prevScene() {
            if (currentScene > 0) {
                currentScene--;
                renderScene();
            }
        }

        function resetJourney() {
            if (confirm("هل تريدين إعادة الرحلة من البداية؟")) {
                currentScene = 0;
                localStorage.setItem('saronti_scene', 0);
                renderScene();
            }
        }

        function selectOption(btn) {
            document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            setTimeout(nextScene, 600);
        }

        function sendSarahMessage() {
            const msg = document.getElementById('sarahMessage').value;
            if(msg.trim() !== "") {
                // حفظ الرسالة في localStorage كنسخة احتياطية محلية مضمونة
                let messages = JSON.parse(localStorage.getItem('sarah_messages') || '[]');
                messages.push({text: msg, date: new Date().toLocaleString()});
                localStorage.setItem('sarah_messages', JSON.stringify(messages));
                
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('sarahMessage').value = '';
            } else {
                alert("الرجاء كتابة شيء قبل الإرسال يا سارونتي..");
            }
        }

        // تشغيل المشهد الحالي عند تحميل الصفحة
        renderScene();
    </script>
</body>
</html>
