<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سارونتي | أجمل حكاية</title>
    <style>
        :root {
            --dark-red: #2B040A;
            --deep-burgundy: #180205;
            --rose-red: #8B001D;
            --bright-gold: #FFD700;
            --soft-gold: #E6C687;
            --cream-bg: #FFF4F4;
            --paper-color: #FDF4E7;
            --white-pure: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--deep-burgundy);
            color: var(--white-pure);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية ليلية مع بتلات متساقطة */
        .bg-night {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, #4A0512 0%, #180205 70%);
            z-index: 0;
        }

        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: rgba(220, 20, 60, 0.4);
            border-radius: 150% 0 150% 0;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.3);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* الإطار الرئيسي للتطبيق المصمم للجوال */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(180deg, rgba(43, 4, 10, 0.92) 0%, rgba(24, 2, 5, 0.97) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 50px rgba(139, 0, 29, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        @media (min-width: 441px) {
            .app-container {
                border-radius: 28px;
                height: 90vh;
            }
        }

        /* الشريط العُلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--soft-gold);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 10px;
        }

        .btn-restart {
            background: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--soft-gold);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }

        /* منطقة المحتوى */
        .scene-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px 5px;
            animation: fadeInScene 0.7s ease;
            overflow-y: auto;
        }

        @keyframes fadeInScene {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            font-size: 24px;
            color: var(--soft-gold);
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--paper-color);
            margin-bottom: 18px;
            max-width: 340px;
        }

        .icon-header {
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* الأزرار الوردية الراقية مثل التصميم */
        .btn-main {
            background: linear-gradient(135deg, #A80927 0%, #610012 100%);
            color: var(--white-pure);
            border: 1px solid var(--soft-gold);
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(168, 9, 39, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        /* كرت الظرف العتيق والرسالة */
        .envelope-card {
            background: var(--paper-color);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px dashed #D4A373;
            width: 100%;
            max-width: 320px;
            margin-bottom: 15px;
        }

        .envelope-card p {
            color: #4A2E16;
            font-size: 14px;
        }

        /* خيارات أسئلة ستايل الصورة */
        .quiz-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .quiz-btn {
            background: rgba(255, 244, 244, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--white-pure);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* كروت الزهور الثلاثة */
        .flower-grid {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .flower-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 10px 5px;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }

        /* مربع النص لكتابة الرسالة */
        textarea {
            width: 100%;
            max-width: 320px;
            height: 100px;
            background: rgba(255, 244, 244, 0.15);
            border: 1px solid var(--soft-gold);
            border-radius: 12px;
            padding: 10px;
            color: var(--white-pure);
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }
