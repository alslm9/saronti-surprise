<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eee8df">
  <title>إلى سارونتي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eee8df;
      color: #55443f;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      min-height: 570px;
      padding: 55px 25px 35px;
      border: 1px solid #ded2c5;
      border-radius: 180px 180px 28px 28px;
      background: #faf7f1;
      text-align: center;
      box-shadow: 0 18px 55px #55443f12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .flower {
      font-size: 65px;
      margin-bottom: 25px;
      animation: bloom 3s ease-in-out infinite alternate;
    }

    .small-title {
      color: #9a8275;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    h1 {
      color: #762f40;
      font-size: 32px;
      font-weight: 500;
      margin: 0 0 22px;
    }

    .intro {
      color: #78675e;
      font-size: 17px;
      line-height: 2.1;
      margin: 0 0 32px;
    }

    button {
      border: 0;
      border-radius: 40px;
      padding: 15px 38px;
      background: #762f40;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .message {
      display: none;
      margin-top: 25px;
      color: #762f40;
      line-height: 2;
      font-size: 16px;
    }

    .signature {
      margin-top: 38px;
      color: #a18e80;
      font-size: 13px;
    }

    @keyframes bloom {
      from { transform: scale(.94) rotate(-4deg); }
      to { transform: scale(1.06) rotate(4deg); }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="flower">🌷</div>

    <div class="small-title">حكاية مختلفة</div>

    <h1>إلى سارونتي</h1>

    <p class="intro">
      مو كل الصدف عادية<br>
      وبعض الأشخاص يدخلون حياتنا<br>
      ويصير وجودهم حكاية ما تشبه أي حكاية
    </p>

    <button onclick="openStory()">ابدئي الحكاية</button>

    <p class="message" id="message">
      على مهلك يا سارونتي...<br>
      للحكاية بقية، وأحلى تفاصيلها لسه قدامك.
    </p>

    <div class="signature">من سلوم، بكل الحب</div>
  </main>

  <script>
    function openStory() {
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>
